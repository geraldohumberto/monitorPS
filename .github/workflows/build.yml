name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore
      - run: dotnet build --configuration Release --no-restore
      - run: dotnet run --project tests/WindowsProfileManager.Tests/WindowsProfileManager.Tests.csproj --configuration Release --no-build
      - name: Publish app
        run: dotnet publish src/WindowsProfileManager.App/WindowsProfileManager.App.csproj --configuration Release --runtime win-x64 --self-contained false --output artifacts/PerfilWindows
      - name: Package app
        run: Compress-Archive -Path artifacts/PerfilWindows/* -DestinationPath artifacts/PerfilWindows-win-x64.zip -Force
      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: PerfilWindows-win-x64
          path: artifacts/PerfilWindows-win-x64.zip
